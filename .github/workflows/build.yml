name: build

on:
  push:
    branches:
      - integration
      - master
      - "codex/**"
  pull_request:

jobs:
  windows:
    name: Windows x64
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Restore and build
        run: msbuild FileConverter.sln /restore /m /p:Configuration=Release /p:Platform=x64
